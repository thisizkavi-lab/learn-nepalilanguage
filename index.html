    <h2>Nepali Table Rules & Etiquette</h2>
    <p>Eating in Nepal is relaxed and welcoming, but understanding a few basic cultural customs will earn you warm smiles and instant respect from any Nepali host:</p>

    <div class="places-grid">
        <div class="place-card">
            <div>
                <div class="place-card-header">
                    <span class="place-card-title">1. Eat with your right hand</span>
                    <span class="place-card-meta">Tradition</span>
                </div>
                <p>Traditionally, Nepalis eat Dal Bhat with their right hand. Mixing the lentils, rice, and vegetable curry with your fingertips allows you to feel the temperature and blend the flavors perfectly. The left hand is traditionally reserved for personal hygiene, so avoid eating or passing food with it. (Of course, spoons and forks are always available if you prefer!)</p>
            </div>
        </div>

        <div class="place-card">
            <div>
                <div class="place-card-header">
                    <span class="place-card-title">2. The Rule of "Jhutho" (झुठो)</span>
                    <span class="place-card-meta">Food Purity</span>
                </div>
                <p>Once food or water has touched your lips, it becomes <strong>jhutho</strong> (personally touched/contaminated). Do not take a bite of an apple and offer the rest to a friend, or sip from a water bottle touching your lips if others plan to drink from it. Nepalis practice pouring water into their mouths from a bottle without touching their lips.</p>
            </div>
        </div>

        <div class="place-card">
            <div>
                <div class="place-card-header">
                    <span class="place-card-title">3. The Magic Word: "Pugyo" (पुग्यो)</span>
                    <span class="place-card-meta">Free Refills</span>
                </div>
                <p>When eating Dal Bhat at any local restaurant or home, hospitality dictates that servers will come around continuously to give you more rice, dal, and vegetables. If you do not want another mountain of food, place your hand gently over your plate and say with a smile: <strong>“Pugyo, dhanyabaad!”</strong> (That is enough, thank you!).</p>
            </div>
        </div>

        <div class="place-card">
            <div>
                <div class="place-card-header">
                    <span class="place-card-title">4. Refusing Politely</span>
                    <span class="place-card-meta">Hospitality</span>
                </div>
                <p>Nepali hosts will almost always offer you second and third servings. Refusing once is considered polite modesty; your host will insist again. If you are truly full, a gentle pat on the stomach and saying <em>“Dherai mitho thiyo, tara mero pet bhariyo”</em> (It was delicious, but my stomach is completely full!) is the warmest response.</p>
            </div>
        </div>
    </div>

    <h3>Useful Phrases for Ordering & Eating</h3>
    <p>Here are everyday phrases that will make eating out in Nepal effortless and fun:</p>

    <div class="table-responsive">
        <table class="travel-phrases-table">
            <thead>
                <tr>
                    <th>Nepali (नेपाली)</th>
                    <th>Pronunciation</th>
                    <th>Meaning</th>
                    <th>When to Use</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><strong>खाना धेरै मिठो छ!</strong></td>
                    <td><em>Khaana dherai mitho chha!</em></td>
                    <td>The food is very delicious!</td>
                    <td>The highest compliment you can give your cook or restaurant server.</td>
                </tr>
                <tr>
                    <td><strong>पिरो कम गर्नुहोस्।</strong></td>
                    <td><em>Piro kam garnuhos.</em></td>
                    <td>Please make it less spicy.</td>
                    <td>Crucial if you have a low tolerance for hot green chilies!</td>
                </tr>
                <tr>
                    <td><strong>पुग्यो, धन्यवाद!</strong></td>
                    <td><em>Pugyo, dhanyabaad!</em></td>
                    <td>That is enough, thank you!</td>
                    <td>Said when you have had enough refills of Dal Bhat.</td>
                </tr>
                <tr>
                    <td><strong>म शाकाहारी हुँ।</strong></td>
                    <td><em>Ma shaakaahaari hun.</em></td>
                    <td>I am a vegetarian.</td>
                    <td>Use this when ordering food if you don’t eat meat.</td>
                </tr>
                <tr>
                    <td><strong>तातो पानी दिनुहोस्।</strong></td>
                    <td><em>Taato paani dinuhos.</em></td>
                    <td>Please give me hot drinking water.</td>
                    <td>Very common in mountain lodges and winter tea stalls.</td>
                </tr>
                <tr>
                    <td><strong>एक प्लेट मम: दिनुहोस्।</strong></td>
                    <td><em>Ek plate momo dinuhos.</em></td>
                    <td>Please give me one plate of momos.</td>

                    <td><em>Bill dinuhos.</em></td>
                    <td>Please give me the bill.</td>
